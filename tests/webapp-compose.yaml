services:
  hermes:
    user: "0:0"
    init: false
    entrypoint: !reset null
    command: [gateway, run]
    # Restore the production grants cleared by the unprivileged core fixture.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETUID, SETGID]
  setup:
    volumes:
      - type: bind
        source: ${WEBAPP_TEST_CONFIG:?test auth directory required}
        target: /run/webapp
        read_only: true
        bind: {create_host_path: false}
  webapp-proxy:
    profiles: !reset []
    volumes:
      - type: bind
        source: ${WEBAPP_TEST_PROXY:?test proxy required}
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind: {create_host_path: false}
  x402_treazury:
    profiles: [x402_treazury]
    depends_on: !override
      tor: {condition: service_healthy}
      agent-net: {condition: service_healthy}
  tailscale:
    profiles: [real-funnel]
  tls-fixture:
    image: private-hermes-executor:local
    init: true
    user: "10000:10000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    command: [python3, /opt/webapp-tls.py]
    volumes:
      - ./tests/fixtures/webapp-tls.py:/opt/webapp-tls.py:ro
      - ${WEBAPP_TEST_TLS:?test TLS required}:/run/test-tls:ro
    ports: ["127.0.0.1:10000:10000"]
    networks:
      funnel-link:
        ipv4_address: 10.203.87.2
      webapp-publish: {}

  teep:
    # Browser/chat qualification uses deterministic local inference. Routing and
    # actual Teep behavior remain covered separately by make test.
    image: private-hermes-executor:local
    build: !reset null
    entrypoint: [python3, /opt/webapp-inference.py]
    command: []
    user: "10000:10000"
    volumes:
      - ./tests/fixtures/webapp-inference.py:/opt/webapp-inference.py:ro
    networks: !override
      inference:
        ipv4_address: 10.203.83.3
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8337/health]
      interval: 1s
      timeout: 2s
      retries: 5
