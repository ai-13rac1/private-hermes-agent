name: private-hermes

x-isolated: &isolated
  internal: true
  driver_opts:
    com.docker.network.bridge.gateway_mode_ipv4: isolated
    com.docker.network.bridge.gateway_mode_ipv6: isolated

x-network: &network
  image: private-hermes-network:local
  build:
    context: .
    dockerfile: docker/network.Dockerfile
  cap_drop: [ALL]
  cap_add: [NET_ADMIN]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp:mode=1777]
  restart: unless-stopped
  healthcheck:
    test: [CMD, test, -f, /tmp/network-ready]
    interval: 10s
    start_interval: 1s
    timeout: 2s
    retries: 3
    start_period: 20s

services:
  bootstrap:
    image: private-hermes-executor:local
    build:
      context: .
      dockerfile: docker/executor.Dockerfile
    network_mode: none
    entrypoint: [python3, /opt/bootstrap.py]
    volumes:
      - agent-ssh:/agent-ssh
      - executor-auth:/executor-auth
      - hermes-data:/agent-data
      - executor-home:/executor-home
      - executor-work:/executor-work
      - ./config/hermes.example.yaml:/opt/hermes-config.yaml:ro

  configure:
    profiles: [maintenance]
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002}
    network_mode: none
    user: "10000:10000"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [/opt/hermes/.venv/bin/hermes, config]
    volumes:
      - hermes-data:/opt/data

  tor:
    <<: *network
    command: [router]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - tor-state:/var/lib/tor
      - ./config/torrc:/etc/tor/torrc:ro
    tmpfs:
      - /tmp:mode=1777
      - /run/tor-control:uid=101,gid=102,mode=0700
    networks:
      tor-uplink: {}
      agent-route:
        ipv4_address: 10.203.80.3
      executor-route:
        ipv4_address: 10.203.81.3
    healthcheck:
      test: [CMD, python3, /opt/tor-health.py]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      start_period: 300s
      retries: 5

  agent-net:
    <<: *network
    command: [agent]
    depends_on:
      tor: {condition: service_healthy}
    volumes:
      - ./config/mcp-allowlist.json:/etc/private-hermes/mcp-allowlist.json:ro
    networks:
      agent-route:
        ipv4_address: 10.203.80.2
      execution-control:
        ipv4_address: 10.203.82.2
      inference:
        ipv4_address: 10.203.83.2
      mcp-access:
        ipv4_address: 10.203.84.2

  executor-net:
    <<: *network
    command: [executor]
    depends_on:
      tor: {condition: service_healthy}
    networks:
      executor-route:
        ipv4_address: 10.203.81.2
      execution-control:
        ipv4_address: 10.203.82.3

  executor:
    image: private-hermes-executor:local
    build:
      context: .
      dockerfile: docker/executor.Dockerfile
    network_mode: service:executor-net
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      executor-net: {condition: service_healthy}
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777, /run:mode=0755]
    volumes:
      - executor-auth:/run/executor-auth:ro
      - executor-home:/home/runner
      - executor-work:/workspace
      - ./config/executor-resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "test -f /run/sshd.pid && kill -0 $$(cat /run/sshd.pid)"]
      interval: 10s
      start_interval: 1s
      timeout: 2s
      retries: 3
      start_period: 15s

  teep:
    image: private-hermes-teep:local
    build:
      context: .
      dockerfile: docker/teep.Dockerfile
    env_file:
      - path: ${TEEP_ENV_FILE:-./teep.env}
        required: false
    environment:
      TEEP_LISTEN_ADDR: 0.0.0.0:8337
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
    networks:
      inference:
        ipv4_address: 10.203.83.3
      teep-uplink:
        gw_priority: 1
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:mode=1777]
    restart: unless-stopped

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002}
    network_mode: service:agent-net
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      agent-net: {condition: service_healthy}
      executor: {condition: service_healthy}
      teep: {condition: service_healthy}
    cap_drop: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    volumes:
      - hermes-data:/opt/data
      - agent-ssh:/run/agent-ssh:ro
      - ./config/ssh-client.conf:/etc/ssh/ssh_config.d/99-private-hermes.conf:ro
      - ./config/agent-resolv.conf:/etc/resolv.conf:ro
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "0"
      OPENAI_BASE_URL: http://10.203.83.3:8337/v1
      OPENAI_API_KEY: unused
      TERMINAL_SSH_HOST: 10.203.82.3
      TERMINAL_SSH_PORT: "2222"
      TERMINAL_SSH_USER: runner
      TERMINAL_SSH_KEY: /run/agent-ssh/id_ed25519
      NO_PROXY: 10.203.83.3,10.203.84.0/24,localhost,127.0.0.1
    command: [gateway, run]
    restart: unless-stopped

networks:
  tor-uplink: {}
  teep-uplink: {}
  agent-route:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.80.0/24}]
  executor-route:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.81.0/24}]
  execution-control:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.82.0/24}]
  inference:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.83.0/24}]
  mcp-access:
    <<: *isolated
    ipam:
      config: [{subnet: 10.203.84.0/24}]

volumes:
  hermes-data: {}
  tor-state: {}
  agent-ssh: {}
  executor-auth: {}
  executor-home: {}
  executor-work: {}
